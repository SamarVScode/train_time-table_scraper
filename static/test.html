<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote API Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
        <h1 class="text-xl font-bold mb-4 text-slate-800">Render API Tester</h1>
        <p class="text-sm text-slate-500 mb-6">Enter a train number to test your live Render.io backend.</p>
        
        <div class="space-y-4">
            <input type="text" id="trainNo" placeholder="e.g. 12002" maxlength="5"
                   class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            
            <button onclick="testRemoteAPI()" id="testBtn"
                    class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition">
                Test Live API
            </button>
        </div>

        <div id="result" class="mt-6 p-4 rounded-lg hidden text-sm font-mono overflow-auto max-h-60 bg-slate-50 border">
            <!-- Results appear here -->
        </div>

        <div id="status" class="mt-4 text-xs font-semibold text-center"></div>
    </div>

    <script>
        async function testRemoteAPI() {
            const trainNo = document.getElementById('trainNo').value;
            const resultDiv = document.getElementById('result');
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('testBtn');

            if (trainNo.length !== 5) {
                alert("Enter 5 digits");
                return;
            }

            // UI Reset
            resultDiv.classList.add('hidden');
            statusDiv.innerText = "Connecting to Render...";
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                // Change this URL to your actual Render URL
                const RENDER_URL = "https://train-time-table-scraper.onrender.com";
                const response = await fetch(`${RENDER_URL}/api/train/${trainNo}`);
                const data = await response.json();

                resultDiv.classList.remove('hidden');
                resultDiv.innerText = JSON.stringify(data, null, 2);

                if (data.success) {
                    const source = data.cached ? "✅ CACHE (Supabase)" : "🌐 SCRAPER (IndiaRailInfo)";
                    statusDiv.innerHTML = `<span class="text-emerald-600">Success! Served via: ${source}</span>`;
                } else {
                    statusDiv.innerHTML = `<span class="text-red-600">API Error: ${data.error}</span>`;
                }

            } catch (err) {
                statusDiv.innerHTML = `<span class="text-red-600">Network Error: Could not reach Render.</span>`;
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "Test Live API";
            }
        }
    </script>
</body>
</html>
