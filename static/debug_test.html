<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Debugger - Seat Availability</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        pre, code { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-bold text-white">API Debugger</h1>
            <p class="text-slate-400 mt-2">Diagnosing "Unexpected token <" and Network Errors</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <!-- Configuration Form -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-semibold mb-4 text-blue-400">Request Parameters</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Backend URL</label>
                        <input type="text" id="baseUrl" value="https://train-time-table-scraper.onrender.com" 
                               class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 focus:border-blue-500 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Train No</label>
                            <input type="text" id="trainNo" value="12002" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Date (DD-MM-YYYY)</label>
                            <input type="text" id="date" value="25-06-2024" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">From</label>
                            <input type="text" id="from" value="NDLS" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">To</label>
                            <input type="text" id="to" value="VGLB" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2">
                        </div>
                    </div>
                    <button onclick="testApi()" id="btnTest" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-colors mt-2">
                        Run API Test
                    </button>
                </div>
            </div>

            <!-- Status & Summary -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-semibold mb-4 text-purple-400">Diagnostics</h2>
                <div id="diagStatus" class="space-y-3">
                    <p class="text-slate-500">Click "Run API Test" to begin diagnosis.</p>
                </div>
            </div>
        </div>

        <!-- Raw Output Console -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-xl overflow-hidden">
            <div class="bg-slate-700 px-4 py-2 flex justify-between items-center border-b border-slate-600">
                <span class="text-sm font-bold uppercase tracking-wider text-slate-300">Raw Response Inspector</span>
                <span id="respType" class="text-xs font-medium bg-slate-600 px-2 py-0.5 rounded">IDLE</span>
            </div>
            <div id="rawOutput" class="p-4 h-96 overflow-auto bg-black text-green-400 text-sm whitespace-pre-wrap">
// No request made yet.
            </div>
        </div>
    </div>

    <script>
        async function testApi() {
            const btn = document.getElementById('btnTest');
            const diag = document.getElementById('diagStatus');
            const console = document.getElementById('rawOutput');
            const typeLabel = document.getElementById('respType');
            
            const baseUrl = document.getElementById('baseUrl').value.replace(/\/$/, '');
            const trainNo = document.getElementById('trainNo').value;
            const from = document.getElementById('from').value;
            const to = document.getElementById('to').value;
            const date = document.getElementById('date').value;

            const fullUrl = `${baseUrl}/api/availability?train_no=${trainNo}&from=${from}&to=${to}&date=${date}`;

            btn.disabled = true;
            btn.innerText = "Fetching...";
            diag.innerHTML = `<div class="animate-pulse flex space-x-2"><div class="h-2 w-2 bg-blue-400 rounded-full"></div><span>Calling: ${fullUrl}</span></div>`;
            console.innerText = `>>> GET ${fullUrl}\n>>> Waiting for response...`;
            typeLabel.innerText = "WAITING";
            typeLabel.className = "text-xs font-medium bg-blue-900 text-blue-200 px-2 py-0.5 rounded";

            try {
                const response = await fetch(fullUrl);
                const text = await response.text();
                
                typeLabel.innerText = `${response.status} ${response.statusText}`;
                
                if (response.ok) {
                    typeLabel.className = "text-xs font-medium bg-green-900 text-green-200 px-2 py-0.5 rounded";
                } else {
                    typeLabel.className = "text-xs font-medium bg-red-900 text-red-200 px-2 py-0.5 rounded";
                }

                console.innerText = text;

                // Diagnosis Logic
                let diagnosis = "";
                if (text.trim().startsWith('<!doctype') || text.trim().startsWith('<html')) {
                    diagnosis = `
                        <div class="p-3 bg-red-900/30 border border-red-500/50 rounded-lg">
                            <p class="text-red-400 font-bold">⚠️ HTML RETURNED INSTEAD OF JSON</p>
                            <p class="text-xs mt-1">The server returned an HTML document. This is why you see the "Unexpected token &lt;" error.</p>
                            <ul class="text-xs list-disc ml-4 mt-2 space-y-1">
                                <li>If it says <strong>404 Not Found</strong>, the route isn't registered on Render.</li>
                                <li>If it shows a <strong>Python Traceback</strong>, your app crashed.</li>
                                <li>Check the "Raw Response Inspector" below to read the error.</li>
                            </ul>
                        </div>
                    `;
                } else {
                    try {
                        JSON.parse(text);
                        diagnosis = `
                            <div class="p-3 bg-green-900/30 border border-green-500/50 rounded-lg">
                                <p class="text-green-400 font-bold">✅ VALID JSON RECEIVED</p>
                                <p class="text-xs mt-1">The API is working correctly. If the main UI still fails, check for CORS or parameter mismatches.</p>
                            </div>
                        `;
                    } catch(e) {
                        diagnosis = `
                            <div class="p-3 bg-yellow-900/30 border border-yellow-500/50 rounded-lg">
                                <p class="text-yellow-400 font-bold">⚠️ INVALID FORMAT</p>
                                <p class="text-xs mt-1">Response is neither HTML nor valid JSON. Raw text displayed below.</p>
                            </div>
                        `;
                    }
                }
                diag.innerHTML = diagnosis;

            } catch (err) {
                typeLabel.innerText = "NETWORK ERROR";
                typeLabel.className = "text-xs font-medium bg-red-600 text-white px-2 py-0.5 rounded";
                console.innerText = err.toString();
                diag.innerHTML = `
                    <div class="p-3 bg-red-900/30 border border-red-500/50 rounded-lg">
                        <p class="text-red-400 font-bold">🚫 NETWORK ERROR</p>
                        <p class="text-xs mt-1">${err.message}</p>
                        <p class="text-xs mt-2 italic text-slate-400">Common causes: CORS blocked, Server Down, or Localhost/HTTPS mismatch.</p>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.innerText = "Run API Test";
            }
        }
    </script>
</body>
</html>
